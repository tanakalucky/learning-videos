<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>IAP / Learning videos</title><style>body{margin:40px auto;max-width:1100px;background:#0b1425;color:#f1f5fc;font:18px system-ui;padding:0 24px}video{width:100%;border-radius:18px}button{margin:5px;padding:10px 14px;background:#1d2e49;color:#f1f5fc;border:1px solid #72b6ff;border-radius:8px;cursor:pointer}small{color:#aabbd4}</style><h1>IAPは、アプリの入口を守る</h1><p>78秒 / 日本語字幕 / 音声なし</p><video controls preload="metadata" src="output/iap-ja.mp4"></video><div id="chapters"></div><p><small>模式図です。矢印の動きは論理的な順序を表し、実測の処理時間ではありません。</small></p><script>const v=document.querySelector('video');[[0,'入口'],[9,'認証'],[20,'認可'],[31,'許可'],[43,'拒否'],[54,'業務権限'],[66,'まとめ']].forEach(([t,s])=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>{v.currentTime=t;v.pause()};document.querySelector('#chapters').append(b)})</script></html>
